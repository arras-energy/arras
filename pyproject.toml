[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "arras"
version = "26.0.0"
description = "Arras Energy GridLAB-D engine"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = "== 3.12.*"
keywords = ["github","python","arras","gridlabd","engine"]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    ]
dynamic=["dependencies"]

[project.urls]
Homepage = "https://github.com/arras-energy/gridlabd"
Documentation = "https://arras.energy/gridlabd"
Repository = "https://github.com/arras-energy/gridlabd.git"
Issues = "https://github.com/arras-energy/gridlabd/issues"

[project.scripts]
arras = "arras.main:main"

[tool.pytest.ini_options]
testpaths = ["src/arras/_test"]

# Test coverage (CI runs `pytest --cov`; needs pytest-cov)
[tool.coverage.run]
source_pkgs = ["arras"]
omit = ["*/arras/_test/*"]
branch = true
relative_files = true

[tool.coverage.paths]
# CI installs non-editable: report site-packages files as the source tree
source = ["src/arras/","*/site-packages/arras/"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
