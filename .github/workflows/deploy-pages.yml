name: Documentation

on:
  # Code and pyproject.toml changes also trigger Validation, so their docs are
  # published by the workflow_run below (one deploy per push, docs only for
  # passing code). Push triggers only for files Validation does not watch.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
  # docs (pdoc reads the package docstrings) and coverage after Validation passes on main
  workflow_run:
    workflows: ["Validation"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the coverage report artifact
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04 # ubuntu-latest (26.04) has no python 3.12 builds yet
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # must satisfy requires-python
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pdoc

      - name: Create docs
        run: |
          pdoc -o docs arras assert climate tape

      - name: Add coverage report
        # coverage-report artifact of the Validation run that triggered this one,
        # else of the latest successful Validation run on main;
        # served at /coverage/ (badge.json feeds the README badge)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run=${RUN_ID:-$(gh run list -R "$GITHUB_REPOSITORY" -w validate.yaml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')}
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n coverage-report -D coverage-report
          mv coverage-report/htmlcov docs/coverage

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
