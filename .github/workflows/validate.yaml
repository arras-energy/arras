name: Validation

# Run only when code or packaging changes
on:
  push:
    branches: [ main ]
    paths: &paths
      - "src/**"
      - "!**/*.md"
      - "pyproject.toml"
      - ".github/workflows/validate.yaml"
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04 # ubuntu-latest (26.04) has no python 3.12 builds yet
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # must satisfy requires-python
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install packages
      run: |
        pip install --upgrade pip
        pip install . pytest pytest-cov pylint   # non-editable: catches packaging mistakes

    - name: Analyse code
      run: |
        pylint --fail-under 0 src/arras/*.py

    - name: Run tests
      # coverage settings are in pyproject.toml ([tool.coverage.*]); informational only
      run: |
        pytest --durations=10 --cov --cov-report=term --cov-report=xml --cov-report=html

    - name: Coverage summary
      if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
      run: |
        echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        # shields.io endpoint for the README badge (published with the docs);
        # --precision=0: the shell compares integers only
        total=$(coverage report --format=total --precision=0)
        if [ "$total" -ge 90 ]; then color=brightgreen
        elif [ "$total" -ge 80 ]; then color=green
        elif [ "$total" -ge 70 ]; then color=yellow
        else color=red; fi
        mkdir -p htmlcov
        printf '{"schemaVersion":1,"label":"Coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > htmlcov/badge.json

    - name: Upload coverage report
      if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
        retention-days: 90 # the docs site republishes the latest one from main
